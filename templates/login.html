<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Sign-In</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center min-h-screen antialiased selection:bg-indigo-500/30">
    <div class="w-full max-w-sm p-8 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-indigo-500 to-transparent"></div>
        
        <h1 class="text-xl font-bold tracking-tight text-white mb-1">Massage Ledger Matrix</h1>
        <p class="text-xs text-zinc-400 mb-6">Enter access keys to review or modify balances.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-xl text-xs mb-4">
                {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] font-medium uppercase tracking-wider text-zinc-400 mb-1.5">User Handle</label>
                <input type="text" name="username" required autocomplete="off"
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
            <div>
                <label class="block text-[11px] font-medium uppercase tracking-wider text-zinc-400 mb-1.5">Secret Pin</label>
                <input type="password" name="password" required
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
            <button type="submit" 
                    class="w-full bg-white hover:bg-zinc-200 text-zinc-950 text-xs font-semibold py-3 rounded-xl transition-all shadow-lg shadow-white/5 cursor-pointer">
                Establish Session
            </button>
        </form>
    </div>
</body>
</html>
